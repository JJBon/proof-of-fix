# Required check "pof / check" (platform forgejo-config, it-ops#14): scripts/check.sh.
# Runner label test (platform#194): its own credential-less host, so this check no longer queues in front of
# tofu plans and applies. Host executor, plain shell. No credentials: this job never runs upstream code (that
# only runs in containers, openspec/config.yaml rule 4).
name: pof

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Branches of this repository only: a fork's code never runs on the CI host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: test
    timeout-minutes: 15
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth="http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git init -q .
          git -c "$auth" fetch -q --depth 1 "$url" "$GITHUB_SHA" || git -c "$auth" fetch -q "$url" "$GITHUB_REF"
          git checkout -q -f --detach "$GITHUB_SHA"
          git clean -qffdx
          git log -1 --oneline
      - name: check
        env:
          TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # On a pull request: fetch more history and the base branch so scripts/check_scope.py can find the merge
        # base, and skip the Python tests when only documentation changed (proof-of-fix#208). A failed fetch sets no
        # base, so everything runs. On a push to main: no base, everything runs.
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BASE_REF" ]; then
            auth="http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
            if git -c "$auth" fetch -q --deepen 200 "$url" "$GITHUB_SHA" \
              && git -c "$auth" fetch -q --depth 200 "$url" "+refs/heads/$BASE_REF:refs/remotes/base"; then
              export POF_CHECK_BASE=refs/remotes/base
            fi
          fi
          bash scripts/check.sh
